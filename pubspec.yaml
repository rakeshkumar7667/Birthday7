name: hirewave
description: "HireWave - A production-quality job finder mobile app for Job Seekers and Employers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Functional programming
  fpdart: ^1.1.1
  equatable: ^2.0.7
  uuid: ^4.5.1
  intl: ^0.20.2

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  smooth_page_indicator: ^1.2.1
  percent_indicator: ^4.2.5

  # Storage & Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  geolocator: ^13.0.2

  # Network
  dio: ^5.8.0+1

  # Firebase (for production mode)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.3.0

  # Freezed Annotation & Json Annotation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/interview_prep.json
